<!doctype html><html lang="ja"><meta charset="utf-8"><title>In This Moment UI checks</title>
<style>body{font:14px system-ui;margin:24px;background:#f5f5f7;color:#222}iframe{width:440px;height:680px;border:1px solid #ddd;border-radius:12px;margin:8px}pre{white-space:pre-wrap} .pass{color:#167349}.fail{color:#b22}</style>
<h1>In This Moment UI checks</h1><p>HTTP サーバーでリポジトリを配信し、このページを開きます。バックエンドと保存先を模擬するため、実データは変更しません。</p>
<pre id="report">Running…</pre><div id="frames"></div>
<script>
function backend(kind) {
  if (kind === 'android') Object.defineProperty(navigator, 'userAgent', { value: 'Android test' });
  const defs = [300,1800,120].map((s,i) => ({id:'t'+i,name:'',duration_secs:s,unit:'min',notify:'standard',show_in_bar:true,start_at:null,daily:null,color:i===1?'auto':null,segments:20,pin_float:true}));
  const running = Array.from({length:8},(_,i) => ({def_id:'r'+i,label:'期間'+i,length:'30分',remaining:'15:00',remaining_secs:900+i,percent:50,lit:10,segments:20,shade:2,color:'yellow',period:i>=4,once:false,show_in_bar:true,end_at:2000000000}));
  const finished = [false,true].map((period,i) => ({def_id:'f'+i,label:'終了'+i,length:'30分',period,once:false,end_at:1,finished_at:1,segments:20,cells:i?'💥'.repeat(12):null}));
  const state = {timers:defs,running:float?running:[],finished:float?finished:[],focus:'動作確認',done_gimmick:{kind:'off'}};
  const calls = [];
  window.testBackend = {state,calls};
  const storage = new Map([['block-timer-float-fixed',kind==='free-float'?'0':'1']]);
  Object.defineProperty(window,'localStorage',{value:{getItem:k=>storage.get(k)||null,setItem:(k,v)=>storage.set(k,v)}});
  window.__TAURI__ = {window:{getCurrentWindow:()=>({startDragging:async()=>calls.push(['drag']),startResizeDragging:async()=>{}})},core:{invoke:async(cmd,args={})=>{
    calls.push([cmd,structuredClone(args)]);
    if(cmd==='get_state') return structuredClone(state);
    if(cmd==='set_done_gimmick') state.done_gimmick=args.gimmick;
    if(cmd==='save_timers') state.timers=args.timers;
    if(cmd==='stop_timer') state.running=state.running.filter(r=>r.def_id!==args.id);
    if(cmd==='dismiss_finished') state.finished=state.finished.filter(r=>r.def_id!==args.id);
    if(cmd==='start_timer') {
      const t=state.timers.find(t=>t.id===args.id);
      state.finished=state.finished.filter(r=>r.def_id!==args.id);
      state.running.push({def_id:t.id,label:'作業',length:'5分',remaining:'5:00',remaining_secs:t.duration_secs,percent:100,lit:20,segments:20,shade:0,color:'blue',period:false,once:false,show_in_bar:true,end_at:2000000000});
    }
  }}};
}
async function suite(kind) {
  const results=[];
  const check=(name,ok)=>{if(!ok)throw Error(name);results.push(name)};
  const settle=()=>new Promise(r=>setTimeout(r,20));
  const change=(el,value)=>{el.value=value;el.dispatchEvent(new Event('change',{bubbles:true}))};
  try {
    await settle();
    const {state,calls}=window.testBackend;
    if(kind.includes('float')) {
      check('10行を上限なく描画',document.querySelectorAll('.nbar,.frow').length===10);
      check('付箋内の順序',noteEl.children[0]===noteText&&noteEl.children[1]===pinsEl&&noteEl.children[2]===noteBars);
      check('固定ボタンを短い順に描画',[...pinsEl.children].map(b=>b.textContent).join(',')==='2分,5分,30分');
      check('期間の終了済み行を描画',main.querySelectorAll('.done').length===1);
      check('ギミックなしは全消灯',noteBars.querySelector('.done .meter')&&!noteBars.querySelector('.done .on'));
      check('Rustからのギミックをそのまま描画',main.querySelector('.done-cells').textContent==='💥'.repeat(12));
      pinsEl.querySelector('[data-start="t0"]').click();await settle();
      check('固定ボタンで開始・実行中は無効',pinsEl.querySelector('[data-start="t0"]').disabled);
      if(kind==='free-float') check('1行増加で28px伸縮要求',calls.some(([c,a])=>c==='resize_float_by'&&a.delta===28));
      const stop=noteBars.querySelector('[data-stop="t0"]');
      const drags=calls.filter(([c])=>c==='drag').length;
      stop.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,button:0}));stop.click();await settle();
      check('停止ボタンは即時反映・終了済みにしない',!state.running.some(r=>r.def_id==='t0')&&!state.finished.some(f=>f.def_id==='t0'));
      check('停止ボタンでドラッグしない',calls.filter(([c])=>c==='drag').length===drags);
      check('停止後に固定ボタンを再度押せる',!pinsEl.querySelector('[data-start="t0"]').disabled);
      main.querySelector('[data-dismiss="f1"]').click();await settle();
      check('×で対象行だけ削除',state.finished.length===1&&state.finished[0].def_id==='f0');
      if(kind==='free-float') check('1行減少で28px縮小要求',calls.some(([c,a])=>c==='resize_float_by'&&a.delta===-28));
      state.timers.forEach(t=>t.pin_float=false);await renderFloat();
      check('固定なしで余白を非表示',pinsEl.childElementCount===0&&getComputedStyle(pinsEl).display==='none');
    } else {
      document.querySelector('[data-settings]').click();
      const g=document.querySelector('#gimmick'),input=document.querySelector('#gimmick-emoji');
      check('完了ギミック6種',g.options.length===6);
      change(g,'boom');await settle();check('選択を保存',state.done_gimmick.kind==='boom');
      change(g,'custom');await settle();check('自由入力を表示してフォーカス',!input.hidden&&document.activeElement===input);
      change(input,'ab');await settle();check('2文字は拒否',input.getAttribute('aria-invalid')==='true'&&state.done_gimmick.kind==='boom');
      change(input,'');await settle();check('空は拒否',input.getAttribute('aria-invalid')==='true');
      for(const emoji of ['🌟','👨‍👩‍👧‍👦','🇯🇵']) {
        change(input,emoji);await settle();check('1文字を保存 '+emoji,state.done_gimmick.emoji===emoji&&input.getAttribute('aria-invalid')==='false');
      }
      closeSheet();openSettings();check('保存済み設定を再表示',document.querySelector('#gimmick').value==='custom'&&document.querySelector('#gimmick-emoji').value==='🇯🇵');
      closeSheet();openSheet(view.timers[1]);
      check('色の選択肢の順',[...document.querySelectorAll('[data-sw]')].map(b=>b.dataset.sw).join(',')===',auto,red,orange,yellow,green,teal,blue,purple,pink');
      check('自動の選択状態',document.querySelector('[data-sw="auto"]').getAttribute('aria-checked')==='true');
      check('固定ボタン設定のOS差',kind==='android'?!document.querySelector('#f-pin'):!!document.querySelector('#f-pin'));
      if(kind!=='android') {
        document.querySelector('#f-period').click();check('期間では固定設定を隠す',document.querySelector('#w-pin').classList.contains('hidden'));
        document.querySelector('#f-period').click();
      }
      document.querySelector('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await settle();
      check('自動色を保存',state.timers[1].color==='auto');
      check('固定設定を保持',state.timers[1].pin_float===true);
      check('一覧の自動色の丸',!!document.querySelector('.dot.auto'));
    }
    parent.postMessage({kind,results},'*');
  } catch(e) {parent.postMessage({kind,results,error:e.stack},'*')}
}
(async()=>{
 const html=await(await fetch('../dist/index.html')).text();
 const kinds=['mac','android','fixed-float','free-float'];const all={};
 window.addEventListener('message',e=>{
   if(!kinds.includes(e.data?.kind))return;
   all[e.data.kind]=e.data;
   document.querySelector('#report').textContent=Object.values(all).map(r=>r.kind+': '+(r.error?'FAIL '+r.error:'PASS '+r.results.length)+'\n'+r.results.map(x=>'  ✓ '+x).join('\n')).join('\n\n');
   document.querySelector('#report').className=Object.values(all).some(r=>r.error)?'fail':'pass';
   if(Object.keys(all).length===kinds.length)document.title=Object.values(all).some(r=>r.error)?'FAIL — In This Moment UI':'PASS — In This Moment UI';
 });
 for(const kind of kinds) {
   const f=document.createElement('iframe');f.title=kind;
   const start='<script>('+backend.toString()+')('+JSON.stringify(kind)+');<'+ '/script>';
   const end='<script>('+suite.toString()+')('+JSON.stringify(kind)+');<'+ '/script>';
   f.srcdoc=html.replace('const FLOAT = new URLSearchParams(location.search).get("view") === "float";', 'const FLOAT = '+kind.includes('float')+';').replace('<script>',start+'<script>').replace('</body>',end+'</body>');
   document.querySelector('#frames').append(f);
   await new Promise(resolve=>{const done=e=>{if(e.data?.kind===kind){window.removeEventListener('message',done);resolve()}};window.addEventListener('message',done)});
 }
})();
</script></html>
